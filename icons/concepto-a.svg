<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- sinhumo / concepto A: "la voluta se va, queda la linea"
       paleta: base #1f2430 | humo #8a93a0 | linea #f4b740 -->
  <rect id="base" x="16" y="16" width="96" height="96" rx="24" fill="#1f2430"/>
  <g id="humo" fill="none" stroke="#8a93a0" stroke-linecap="round">
    <path id="voluta-baja" d="M50 74 C 50 62, 66 62, 66 52" stroke-width="10"/>
    <path id="voluta-alta" d="M66 52 C 66 42, 80 40, 80 31" stroke-width="10" stroke-opacity="0.55"/>
  </g>
  <path id="linea-clara" d="M38 90 H 90" fill="none" stroke="#f4b740" stroke-width="11" stroke-linecap="round"/>
</svg>
