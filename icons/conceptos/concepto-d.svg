<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- sinhumo / concepto D: "la neblina se despeja": dos bandas de neblina
       (la de arriba mas tenue) que terminan en una linea clara
       paleta: base #1f2430 | neblina #4f5663 y #808996 | linea #f4b740 -->
  <rect x="16" y="16" width="96" height="96" rx="24" fill="#1f2430"/>
  <path d="M36 46 C 46 38, 54 54, 64 46 S 82 38, 92 46" fill="none" stroke="#4f5663" stroke-width="12" stroke-linecap="round"/>
  <path d="M36 68 C 46 60, 54 76, 64 68 S 82 60, 92 68" fill="none" stroke="#808996" stroke-width="12" stroke-linecap="round"/>
  <rect x="34" y="84" width="60" height="12" rx="6" fill="#f4b740"/>
</svg>
